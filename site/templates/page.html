<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#FBFBFA">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131312">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:type" content="article">
<meta property="og:locale" content="ko_KR">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231A1A1A'/%3E%3Cpath d='M8 9h16M8 16h16M8 23h10' stroke='%23FBFBFA' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<script>(function(){var d=document.documentElement;d.className+=" js";try{if(!matchMedia("(min-width: 60em)").matches){d.className+=" m-collapse"}}catch(e){}})();</script>
<style>
{{CSS}}
</style>
</head>
<body>
<a class="skip" href="#main">본문으로 건너뛰기</a>

<header class="hdr" id="top">
  <div class="hdr__in">
    <button class="btn btn--toc js-only" id="toc-open" type="button" aria-haspopup="dialog" aria-controls="toc-sheet" aria-label="목차 열기" title="목차">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    </button>
    <a class="brand" href="#top">
      <span class="brand__kicker">갱신일 <span class="mono">{{UPDATED}}</span></span>
      <span class="brand__title">{{TITLE_MAIN}}</span>
    </a>
    <button class="btn btn--icon btn--search js-only" id="search-toggle" type="button" aria-expanded="false" aria-controls="search-form" aria-label="검색 열기" title="검색">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </button>
    <button class="btn btn--outline btn--all js-only" id="toggle-all" type="button" data-action="close" aria-label="모두 접기" title="모두 접기">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path class="ico--open" d="m7 15 5 5 5-5M7 9l5-5 5 5"/><path class="ico--close" d="m7 20 5-5 5 5M7 4l5 5 5-5"/></svg>
      <span class="btn__label">모두 접기</span>
    </button>
    <form class="srch js-only" id="search-form" role="search" action="#main" method="get">
      <label class="sr-only" for="q">본문 검색</label>
      <div class="srch__box">
        <svg class="srch__icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" name="q" type="search" placeholder="본문 검색 (예: 퍼미션, SOC)" autocomplete="off" enterkeyhint="search" spellcheck="false">
        <button class="btn btn--icon srch__clear" id="q-clear" type="button" aria-label="검색 지우기" hidden>
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
    </form>
  </div>
  <div class="status" id="search-status" role="status" hidden></div>
</header>

<main id="main">
  <section class="hero" aria-labelledby="doc-title">
    <p class="kicker"><a class="kicker__back" href="../">조사 목록</a> <span class="kicker__sep" aria-hidden="true">·</span> 조사 보고서 <span class="kicker__sep" aria-hidden="true">·</span> 작성일 <span class="mono">{{CREATED}}</span> <span class="kicker__sep" aria-hidden="true">·</span> 갱신일 <span class="mono">{{UPDATED}}</span></p>
    <h1 id="doc-title"><span class="hero__sup">{{TITLE_SUP}}</span><span class="hero__sep" aria-hidden="true"> · </span><span class="hero__main">{{TITLE_MAIN}}</span></h1>
  </section>

  <div class="layout">
    <aside class="side" aria-label="목차 사이드바">
      <p class="side__title">목차</p>
      <nav aria-label="목차">{{TOC}}</nav>
    </aside>
    <article class="doc">
{{CONTENT}}
{{SOURCES}}
    </article>
  </div>
</main>

<footer class="ftr">
  <div class="ftr__in">
    <span>작성일 <span class="mono">{{CREATED}}</span></span>
    <span>갱신일 <span class="mono">{{UPDATED}}</span></span>
    <span>공개 자료 기준</span>
    <span>이 페이지는 보고서 Markdown에서 자동 생성되었습니다.</span>
    <a href="../">조사 목록으로</a>
  </div>
</footer>

<dialog class="sheet" id="toc-sheet" aria-labelledby="sheet-title">
  <div class="sheet__head">
    <h2 class="sheet__title" id="sheet-title">목차</h2>
    <button class="btn btn--icon" id="toc-close" type="button" aria-label="목차 닫기">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="sheet__body">
    <nav aria-label="목차">{{TOC}}</nav>
  </div>
</dialog>

<a class="totop js-only" id="totop" href="#top" aria-label="맨 위로" hidden>
  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</a>

<script>
{{JS}}
</script>
</body>
</html>
